name: CI/CD Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_WORDPRESS_URL: ${{ secrets.NEXT_PUBLIC_WORDPRESS_URL || vars.NEXT_PUBLIC_WORDPRESS_URL }}
          NEXT_PUBLIC_GRAPHQL_ENDPOINT: ${{ secrets.NEXT_PUBLIC_GRAPHQL_ENDPOINT || vars.NEXT_PUBLIC_GRAPHQL_ENDPOINT }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
          FAUST_SECRET_KEY: ${{ secrets.FAUST_SECRET_KEY || vars.FAUST_SECRET_KEY }}
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_WORDPRESS_URL=${{ secrets.NEXT_PUBLIC_WORDPRESS_URL || vars.NEXT_PUBLIC_WORDPRESS_URL }}
            NEXT_PUBLIC_GRAPHQL_ENDPOINT=${{ secrets.NEXT_PUBLIC_GRAPHQL_ENDPOINT || vars.NEXT_PUBLIC_GRAPHQL_ENDPOINT }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-strategy:
    name: Resolve Deploy Strategy
    runs-on: ubuntu-latest
    needs: docker
    outputs:
      use_webhook: ${{ steps.strategy.outputs.use_webhook }}
      use_ssh: ${{ steps.strategy.outputs.use_ssh }}
      missing_ssh_fields: ${{ steps.strategy.outputs.missing_ssh_fields }}
      has_runtime_env: ${{ steps.strategy.outputs.has_runtime_env }}
      missing_runtime_env_fields: ${{ steps.strategy.outputs.missing_runtime_env_fields }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Decide deploy mode
        id: strategy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL || vars.DEPLOY_WEBHOOK_URL }}
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          NEXT_PUBLIC_WORDPRESS_URL: ${{ secrets.NEXT_PUBLIC_WORDPRESS_URL || vars.NEXT_PUBLIC_WORDPRESS_URL }}
          NEXT_PUBLIC_GRAPHQL_ENDPOINT: ${{ secrets.NEXT_PUBLIC_GRAPHQL_ENDPOINT || vars.NEXT_PUBLIC_GRAPHQL_ENDPOINT }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
          FAUST_SECRET_KEY: ${{ secrets.FAUST_SECRET_KEY || vars.FAUST_SECRET_KEY }}
        run: |
          missing_ssh_fields=""
          missing_runtime_env_fields=""

          if [ -n "$DEPLOY_WEBHOOK_URL" ]; then
            echo "use_webhook=true" >> "$GITHUB_OUTPUT"
          else
            echo "use_webhook=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$SSH_HOST" ]; then
            missing_ssh_fields="SSH_HOST"
          fi

          if [ -z "$SSH_USER" ]; then
            if [ -n "$missing_ssh_fields" ]; then
              missing_ssh_fields="$missing_ssh_fields,SSH_USER"
            else
              missing_ssh_fields="SSH_USER"
            fi
          fi

          if [ -z "$SSH_PRIVATE_KEY" ]; then
            if [ -n "$missing_ssh_fields" ]; then
              missing_ssh_fields="$missing_ssh_fields,SSH_PRIVATE_KEY"
            else
              missing_ssh_fields="SSH_PRIVATE_KEY"
            fi
          fi

          if [ -z "$missing_ssh_fields" ]; then
            echo "use_ssh=true" >> "$GITHUB_OUTPUT"
            echo "missing_ssh_fields=none" >> "$GITHUB_OUTPUT"
          else
            echo "use_ssh=false" >> "$GITHUB_OUTPUT"
            echo "missing_ssh_fields=$missing_ssh_fields" >> "$GITHUB_OUTPUT"
          fi

          if [ -z "$NEXT_PUBLIC_WORDPRESS_URL" ]; then
            missing_runtime_env_fields="NEXT_PUBLIC_WORDPRESS_URL"
          fi

          if [ -z "$NEXT_PUBLIC_GRAPHQL_ENDPOINT" ]; then
            if [ -n "$missing_runtime_env_fields" ]; then
              missing_runtime_env_fields="$missing_runtime_env_fields,NEXT_PUBLIC_GRAPHQL_ENDPOINT"
            else
              missing_runtime_env_fields="NEXT_PUBLIC_GRAPHQL_ENDPOINT"
            fi
          fi

          if [ -z "$NEXT_PUBLIC_SITE_URL" ]; then
            if [ -n "$missing_runtime_env_fields" ]; then
              missing_runtime_env_fields="$missing_runtime_env_fields,NEXT_PUBLIC_SITE_URL"
            else
              missing_runtime_env_fields="NEXT_PUBLIC_SITE_URL"
            fi
          fi

          if [ -z "$FAUST_SECRET_KEY" ]; then
            if [ -n "$missing_runtime_env_fields" ]; then
              missing_runtime_env_fields="$missing_runtime_env_fields,FAUST_SECRET_KEY"
            else
              missing_runtime_env_fields="FAUST_SECRET_KEY"
            fi
          fi

          if [ -z "$missing_runtime_env_fields" ]; then
            echo "has_runtime_env=true" >> "$GITHUB_OUTPUT"
            echo "missing_runtime_env_fields=none" >> "$GITHUB_OUTPUT"
          else
            echo "has_runtime_env=false" >> "$GITHUB_OUTPUT"
            echo "missing_runtime_env_fields=$missing_runtime_env_fields" >> "$GITHUB_OUTPUT"
          fi

  deploy-webhook:
    name: Deploy via Server Webhook
    runs-on: ubuntu-latest
    needs: deploy-strategy
    if: needs.deploy-strategy.outputs.use_webhook == 'true'

    steps:
      - name: Trigger deployment webhook
        run: |
          curl --fail --show-error --silent \
            --request POST \
            "${{ secrets.DEPLOY_WEBHOOK_URL || vars.DEPLOY_WEBHOOK_URL }}"

  deploy-ssh:
    name: Deploy to Server via SSH
    runs-on: ubuntu-latest
    needs: deploy-strategy
    if: needs.deploy-strategy.outputs.use_webhook != 'true' && needs.deploy-strategy.outputs.use_ssh == 'true' && needs.deploy-strategy.outputs.has_runtime_env == 'true'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER || vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE || vars.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || vars.SSH_PORT || 22 }}
          script: |
            set -e
            docker login ${{ env.REGISTRY }} -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            docker stop heventos-frontend || true
            docker rm heventos-frontend || true
            docker run -d \
              --name heventos-frontend \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NEXT_PUBLIC_WORDPRESS_URL="${{ secrets.NEXT_PUBLIC_WORDPRESS_URL || vars.NEXT_PUBLIC_WORDPRESS_URL }}" \
              -e NEXT_PUBLIC_GRAPHQL_ENDPOINT="${{ secrets.NEXT_PUBLIC_GRAPHQL_ENDPOINT || vars.NEXT_PUBLIC_GRAPHQL_ENDPOINT }}" \
              -e NEXT_PUBLIC_SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}" \
              -e FAUST_SECRET_KEY="${{ secrets.FAUST_SECRET_KEY || vars.FAUST_SECRET_KEY }}" \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  deploy-runtime-env-error:
    name: Missing Runtime Env Configuration
    runs-on: ubuntu-latest
    needs: deploy-strategy
    if: needs.deploy-strategy.outputs.use_webhook != 'true' && needs.deploy-strategy.outputs.use_ssh == 'true' && needs.deploy-strategy.outputs.has_runtime_env != 'true'

    steps:
      - name: Fail with clear message
        run: |
          echo "As variáveis de runtime para o container estão ausentes."
          echo "Campos ausentes detectados: ${{ needs.deploy-strategy.outputs.missing_runtime_env_fields }}"
          echo "Configure esses valores em Secrets ou Variables do repositório."
          exit 1

  deploy-config-error:
    name: Missing Deploy Configuration
    runs-on: ubuntu-latest
    needs: deploy-strategy
    if: needs.deploy-strategy.outputs.use_webhook != 'true' && needs.deploy-strategy.outputs.use_ssh != 'true'

    steps:
      - name: Fail with clear message
        run: |
          echo "Nenhuma estratégia de deploy configurada."
          echo "Configure DEPLOY_WEBHOOK_URL (recomendado) ou SSH_HOST+SSH_USER (secret ou variable) e SSH_PRIVATE_KEY (secret)."
          echo "Campos SSH ausentes detectados: ${{ needs.deploy-strategy.outputs.missing_ssh_fields }}"
          exit 1
