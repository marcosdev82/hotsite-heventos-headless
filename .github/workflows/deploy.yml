name: CI/CD Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_WORDPRESS_URL: ${{ secrets.NEXT_PUBLIC_WORDPRESS_URL || vars.NEXT_PUBLIC_WORDPRESS_URL }}
          NEXT_PUBLIC_GRAPHQL_ENDPOINT: ${{ secrets.NEXT_PUBLIC_GRAPHQL_ENDPOINT || vars.NEXT_PUBLIC_GRAPHQL_ENDPOINT }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
          FAUST_SECRET_KEY: ${{ secrets.FAUST_SECRET_KEY || vars.FAUST_SECRET_KEY }}
        run: npm run build

  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.export.outputs.image_ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_WORDPRESS_URL=${{ secrets.NEXT_PUBLIC_WORDPRESS_URL || vars.NEXT_PUBLIC_WORDPRESS_URL }}
            NEXT_PUBLIC_GRAPHQL_ENDPOINT=${{ secrets.NEXT_PUBLIC_GRAPHQL_ENDPOINT || vars.NEXT_PUBLIC_GRAPHQL_ENDPOINT }}
            NEXT_PUBLIC_SITE_URL=${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export image ref
        id: export
        run: echo "image_ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"

  deploy-strategy:
    name: Resolve Deploy Strategy
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      use_webhook: ${{ steps.strategy.outputs.use_webhook }}
      use_ssh: ${{ steps.strategy.outputs.use_ssh }}
      webhook_url: ${{ steps.strategy.outputs.webhook_url }}
      missing_ssh_fields: ${{ steps.strategy.outputs.missing_ssh_fields }}
      has_runtime_env: ${{ steps.strategy.outputs.has_runtime_env }}
      missing_runtime_env_fields: ${{ steps.strategy.outputs.missing_runtime_env_fields }}
    steps:
      - name: Decide deploy mode
        id: strategy
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEPLOY_WEBHOOK_URL || vars.DEPLOY_WEBHOOK_URL }}
          SSH_HOST: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER || vars.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          NEXT_PUBLIC_WORDPRESS_URL: ${{ secrets.NEXT_PUBLIC_WORDPRESS_URL || vars.NEXT_PUBLIC_WORDPRESS_URL }}
          NEXT_PUBLIC_GRAPHQL_ENDPOINT: ${{ secrets.NEXT_PUBLIC_GRAPHQL_ENDPOINT || vars.NEXT_PUBLIC_GRAPHQL_ENDPOINT }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}
          FAUST_SECRET_KEY: ${{ secrets.FAUST_SECRET_KEY || vars.FAUST_SECRET_KEY }}
        run: |
          set -euo pipefail

          missing_ssh_fields=""
          missing_runtime_env_fields=""
          webhook_url="$(printf '%s' "${DEPLOY_WEBHOOK_URL:-}" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          if [ -n "$webhook_url" ] && [[ "$webhook_url" =~ ^https?://[^[:space:]]+$ ]]; then
            echo "use_webhook=true" >> "$GITHUB_OUTPUT"
            echo "webhook_url=$webhook_url" >> "$GITHUB_OUTPUT"
          else
            echo "use_webhook=false" >> "$GITHUB_OUTPUT"
            echo "webhook_url=" >> "$GITHUB_OUTPUT"
          fi

          [ -z "${SSH_HOST:-}" ] && missing_ssh_fields="SSH_HOST"
          [ -z "${SSH_USER:-}" ] && missing_ssh_fields="${missing_ssh_fields:+$missing_ssh_fields,}SSH_USER"
          [ -z "${SSH_PRIVATE_KEY:-}" ] && missing_ssh_fields="${missing_ssh_fields:+$missing_ssh_fields,}SSH_PRIVATE_KEY"

          if [ -z "$missing_ssh_fields" ]; then
            echo "use_ssh=true" >> "$GITHUB_OUTPUT"
            echo "missing_ssh_fields=none" >> "$GITHUB_OUTPUT"
          else
            echo "use_ssh=false" >> "$GITHUB_OUTPUT"
            echo "missing_ssh_fields=$missing_ssh_fields" >> "$GITHUB_OUTPUT"
          fi

          [ -z "${NEXT_PUBLIC_WORDPRESS_URL:-}" ] && missing_runtime_env_fields="NEXT_PUBLIC_WORDPRESS_URL"
          [ -z "${NEXT_PUBLIC_GRAPHQL_ENDPOINT:-}" ] && missing_runtime_env_fields="${missing_runtime_env_fields:+$missing_runtime_env_fields,}NEXT_PUBLIC_GRAPHQL_ENDPOINT"
          [ -z "${NEXT_PUBLIC_SITE_URL:-}" ] && missing_runtime_env_fields="${missing_runtime_env_fields:+$missing_runtime_env_fields,}NEXT_PUBLIC_SITE_URL"
          [ -z "${FAUST_SECRET_KEY:-}" ] && missing_runtime_env_fields="${missing_runtime_env_fields:+$missing_runtime_env_fields,}FAUST_SECRET_KEY"

          if [ -z "$missing_runtime_env_fields" ]; then
            echo "has_runtime_env=true" >> "$GITHUB_OUTPUT"
            echo "missing_runtime_env_fields=none" >> "$GITHUB_OUTPUT"
          else
            echo "has_runtime_env=false" >> "$GITHUB_OUTPUT"
            echo "missing_runtime_env_fields=$missing_runtime_env_fields" >> "$GITHUB_OUTPUT"
          fi

  deploy-webhook:
    name: Deploy via EasePanel Webhook
    runs-on: ubuntu-latest
    needs: deploy-strategy
    if: needs.deploy-strategy.outputs.use_webhook == 'true'
    steps:
      - name: Trigger webhook
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --request POST "${{ needs.deploy-strategy.outputs.webhook_url }}"
          echo "Webhook deploy disparado com sucesso."

  deploy-ssh:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: deploy-strategy
    if: needs.deploy-strategy.outputs.use_webhook != 'true' && needs.deploy-strategy.outputs.use_ssh == 'true' && needs.deploy-strategy.outputs.has_runtime_env == 'true'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST || vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER || vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE || vars.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || vars.SSH_PORT || 22 }}
          script: |
            set -e
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull ghcr.io/${{ github.repository }}:latest
            docker stop heventos-frontend || true
            docker rm heventos-frontend || true
            docker run -d \
              --name heventos-frontend \
              --restart unless-stopped \
              -p 3000:3000 \
              -e NEXT_PUBLIC_WORDPRESS_URL="${{ secrets.NEXT_PUBLIC_WORDPRESS_URL || vars.NEXT_PUBLIC_WORDPRESS_URL }}" \
              -e NEXT_PUBLIC_GRAPHQL_ENDPOINT="${{ secrets.NEXT_PUBLIC_GRAPHQL_ENDPOINT || vars.NEXT_PUBLIC_GRAPHQL_ENDPOINT }}" \
              -e NEXT_PUBLIC_SITE_URL="${{ secrets.NEXT_PUBLIC_SITE_URL || vars.NEXT_PUBLIC_SITE_URL }}" \
              -e FAUST_SECRET_KEY="${{ secrets.FAUST_SECRET_KEY || vars.FAUST_SECRET_KEY }}" \
              ghcr.io/${{ github.repository }}:latest

  fail-if-no-deploy-path:
    name: Fail if deploy strategy is invalid
    runs-on: ubuntu-latest
    needs: deploy-strategy
    if: needs.deploy-strategy.outputs.use_webhook != 'true' && (needs.deploy-strategy.outputs.use_ssh != 'true' || needs.deploy-strategy.outputs.has_runtime_env != 'true')
    steps:
      - name: Stop workflow with clear error
        run: |
          echo "::error::Nenhuma estratégia de deploy válida."
          echo "::error::SSH ausente: ${{ needs.deploy-strategy.outputs.missing_ssh_fields }}"
          echo "::error::Runtime env ausente: ${{ needs.deploy-strategy.outputs.missing_runtime_env_fields }}"
          exit 1
